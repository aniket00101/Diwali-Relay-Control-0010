<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwali Lights Controller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="string">
    <svg viewBox="0 0 100 30" preserveAspectRatio="none"><path d="M0 4 Q25 22 50 8 T100 4" fill="none" stroke="#c9a24a" stroke-width=".8" vector-effect="non-scaling-stroke"/></svg>
    <div class="bulbs" id="hang"></div>
  </div>

  <header>
    <h1 id="greet">🪔 Happy Diwali</h1>
    <div class="sub">Festive Lights Controller</div>
    <div class="count" id="count"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Disconnected</span> · <span id="lit">0/8 lit</span></div>
  </header>

  <div class="layout">
    <div class="topbtns">
      <button class="connect" id="connectBtn">Connect to HC-05</button>
      <button class="ghost" id="demoBtn">🧪 Demo Mode</button>
    </div>

    <section class="panel p-relays">
      <h2>Relays</h2>
      <div class="tiles" id="tiles"></div>
      <div class="duo">
        <button id="allOn" disabled class="go">All ON</button>
        <button id="allOff" disabled>All OFF</button>
      </div>
    </section>

    <section class="panel p-effects">
      <h2>Light Effects</h2>
      <div class="chips" id="pats"></div>
    </section>

    <section class="panel p-scenes">
      <h2>Scenes</h2>
      <div class="chips" id="scenes"></div>
      <button class="ghost small" id="saveScene" disabled>＋ Save current as scene</button>
    </section>

    <section class="panel p-speed">
      <h2>Speed &amp; Timers</h2>
      <div class="speedhead"><span>Step time</span><b id="speedVal">300 ms</b></div>
      <input type="range" id="speed" min="100" max="1500" step="50" value="300" disabled>
      <div class="ends"><span>Fast</span><span>Slow</span></div>
      <div class="row">
        <label>😴 Sleep timer
          <select id="sleep" disabled>
            <option value="0">Off</option><option value="1">1 min</option>
            <option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option>
          </select>
        </label>
        <span id="sleepLeft" class="muted"></span>
      </div>
      <div class="row">
        <button class="ghost small" id="party" disabled>🎉 Party Mode: Off</button>
        <span class="muted">random effect every 12 s</span>
      </div>
    </section>

    <div id="log"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
